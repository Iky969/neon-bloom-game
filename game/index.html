<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neon Bloom</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0;
      height: 100%;
      background: #04060f;
      color: #eaf2ff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      overflow: hidden;
    }
    main {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 12px;
      box-sizing: border-box;
    }
    canvas {
      width: min(100vw, 960px);
      height: auto;
      aspect-ratio: 8 / 5;
      background: #070a18;
      border: 1px solid #24305c;
      border-radius: 10px;
      box-shadow: 0 0 40px rgba(110, 242, 208, 0.12), 0 12px 50px rgba(0, 0, 0, 0.6);
      cursor: crosshair;
      touch-action: none;
    }
  </style>
</head>
<body>
  <main>
    <canvas id="game" aria-label="Neon Bloom game canvas"></canvas>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
